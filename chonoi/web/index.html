<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hc { position: fixed; top: 10px; right: 10px; z-index: 2; font: 600 14px system-ui, sans-serif; padding: 6px 12px;
        border: 2px solid #e8eef2; border-radius: 6px; background: #1d2731; color: #e8eef2; cursor: pointer; }
  #hc[aria-pressed="true"] { background: #ffeb3b; color: #000; border-color: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="hc" type="button" aria-pressed="false" title="Phím H">◐ Tương phản cao (H): TẮT</button>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại · H = tương phản cao.
 * ?hc=1 bật sẵn tương phản cao. ?bench=1&warmup=3&duration=30 là chế độ đo của `python3 -m chonoi.bench`.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- tương phản cao + chế độ bench ----------
const Q = new URLSearchParams(location.search);
const BENCH = Q.get("bench") === "1";
const hcBtn = document.getElementById("hc");
let HC = Q.get("hc") === "1";
if (!BENCH && Q.get("hc") === null) { try { HC = localStorage.getItem("chonoi.hc") === "1"; } catch (e) { /* bỏ qua */ } }
function setHC(on) {
  HC = on;
  hcBtn.setAttribute("aria-pressed", String(on));
  hcBtn.textContent = "◐ Tương phản cao (H): " + (on ? "BẬT" : "TẮT");
  try { localStorage.setItem("chonoi.hc", on ? "1" : "0"); } catch (e) { /* bỏ qua */ }
}
hcBtn.addEventListener("click", () => { setHC(!HC); hcBtn.blur(); });
if (BENCH) hcBtn.style.display = "none"; else setHC(HC);

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "h" && !BENCH) { setHC(!HC); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

// ----- độ tươi (contract v1.2): cá thể {id, kind, fresh}; fresh < 30 là ươn. Chuỗi kind (v1.1) coi như tươi 100. -----
const SPOIL_BELOW = 30;
const asItem = (x) => (typeof x === "string" ? { id: "", kind: x, fresh: 100 } : x);
const isSpoiled = (it) => it.fresh !== undefined && it.fresh < SPOIL_BELOW;
const freshColor = (f) => (f === undefined ? "#9fb3c0" : f < SPOIL_BELOW ? "#e0533d" : f < 60 ? "#e6b422" : "#6fbf5a");
// một ô cá thể: màu loài, thanh tươi dưới đáy, ươn thì mờ + dấu ✕; reserved => viền sáng
function itemCell(it, x, y, sz, reserved) {
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x, y, sz, sz);
  ctx.globalAlpha = isSpoiled(it) ? 0.35 : 1;
  ctx.fillStyle = kc(it.kind); ctx.fillRect(x + 3, y + 3, sz - 6, sz - 10);
  ctx.globalAlpha = 1;
  if (it.fresh !== undefined) {
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x + 3, y + sz - 6, sz - 6, 3);
    ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x + 3, y + sz - 6, (sz - 6) * Math.max(0, Math.min(1, it.fresh / 100)), 3);
  }
  if (isSpoiled(it)) text("✕", x + sz / 2, y + sz / 2 + 4, { size: Math.max(10, sz * 0.5), align: "center", color: "#ff8a80" });
  if (reserved) { ctx.strokeStyle = "#fff176"; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, sz - 2, sz - 2); }
}
// tóm tắt: "cá lóc×2, bông súng×1 · ươn 1"
function itemSummary(items) {
  const n = {}; let bad = 0;
  items.forEach((it) => { n[it.kind] = (n[it.kind] || 0) + 1; if (isSpoiled(it)) bad++; });
  return Object.keys(n).sort().map((k) => (KIND_NAME[k] || k) + "×" + n[k]).join(", ") + (bad ? "  ·  ươn " + bad : "");
}
// cảnh báo ngắn (~2,5 giây) khi có event spoiled gần đây
function spoiledToast(w) {
  const now = snap.tick || 0;
  (snap.events || []).filter((e) => e.name === "spoiled" && now - e.tick <= 150 && now >= e.tick).slice(-3).forEach((e, i) => {
    const d = e.data || {};
    text("⚠ " + (KIND_NAME[d.kind] || d.kind) + " " + (d.item_id || "") + " đã ươn" + (d.location === "hold" ? " (trong giỏ)" : d.location === "stock" ? " (trong kho)" : ""),
      w / 2, 166 + i * 18, { size: 14, align: "center", color: "#ffab91" });  // dưới dải cảnh báo
  });
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  if (BENCH && cv.style.width !== "1280px") { cv.style.width = "1280px"; cv.style.height = "720px"; }  // cảnh đo 1280×720
  const w = BENCH ? 1280 : innerWidth, h = BENCH ? 720 : innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (HC ? "600 " : "") + (o.size || 14) + "px system-ui, sans-serif";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (HC && !o.raw) {  // tương phản cao: chữ trắng viền đen, đọc được trên mọi nền
    ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.lineJoin = "round"; ctx.strokeText(s, x, y);
    ctx.fillStyle = "#fff";
  } else ctx.fillStyle = o.color || "#e8eef2";
  ctx.fillText(s, x, y);
}
// ----- cảnh báo dễ nhận biết (TICKET-04): biểu tượng + chữ, xếp giữa trên cùng -----
function warnings(list, w) {
  const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 160);
  list.forEach((msg, i) => {
    ctx.font = "700 18px system-ui, sans-serif";
    const tw = ctx.measureText(msg).width + 36, x = w / 2 - tw / 2, y = 74 + i * 40;
    ctx.globalAlpha = HC ? 1 : pulse;
    ctx.fillStyle = HC ? "#ffeb3b" : "rgba(183,28,28,.92)"; ctx.fillRect(x, y, tw, 32);
    ctx.lineWidth = HC ? 4 : 2; ctx.strokeStyle = HC ? "#000" : "#fff"; ctx.strokeRect(x, y, tw, 32);
    ctx.globalAlpha = 1;
    ctx.fillStyle = HC ? "#000" : "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(msg, w / 2, y + 17);
  });
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = HC ? "#8fd3ff" : "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  if (HC) ctx.fillStyle = "#001a33";
  else {
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
    ctx.fillStyle = g;
  }
  ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    if (HC) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // thủy quái (Cá Sấu): thân dài, mõm, mắt; đang đuổi thì viền đỏ + vòng phát hiện
  const p = snap.player;
  const species = (meta.monsters && meta.monsters.species) || {};
  const warn = [];
  (snap.monsters || []).forEach((m) => {
    const sp = species[m.kind] || {};
    const dist = p ? Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) : Infinity;
    const near = m.state === "chase" || (sp.detect_radius !== undefined && dist <= sp.detect_radius);
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    if (near && sp.detect_radius) {
      ctx.strokeStyle = HC ? "#ffeb3b" : "rgba(255,82,82,.55)"; ctx.lineWidth = HC ? 3 : 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(mx, my, sp.detect_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    const face = p && p.pos[0] < m.pos[0] ? -1 : 1;
    ctx.save(); ctx.translate(mx, my); ctx.scale(face, 1);
    ctx.fillStyle = HC ? "#ff1744" : "#3f6b3a";
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.5 * s, 0, 0, Math.PI * 2); ctx.fill();          // thân
    ctx.beginPath(); ctx.moveTo(1.5 * s, -0.25 * s); ctx.lineTo(2.8 * s, -0.08 * s); ctx.lineTo(2.8 * s, 0.12 * s); ctx.lineTo(1.5 * s, 0.3 * s); ctx.fill(); // mõm
    ctx.beginPath(); ctx.moveTo(-1.6 * s, 0); ctx.lineTo(-2.9 * s, -0.25 * s); ctx.lineTo(-2.9 * s, 0.2 * s); ctx.fill(); // đuôi
    ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(1.3 * s, -0.3 * s, 0.13 * s, 0, Math.PI * 2); ctx.fill();          // mắt
    if (near || HC) { ctx.strokeStyle = HC ? "#ffeb3b" : "#ff5252"; ctx.lineWidth = HC ? 3 : 2; ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.5 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    text("🐊 " + m.id, mx, my - 0.9 * s, { size: 11, align: "center", color: near ? "#ff8a80" : "rgba(255,255,255,.8)" });
    if (near) warn.push("🐊 THỦY QUÁI GẦN — Cá Sấu " + m.id + " cách " + Math.round(dist) + " m");
  });
  // người chơi
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    if (low) warn.unshift("🫧 OXY SẮP HẾT — còn " + Math.ceil(p.oxygen_ticks / 60) + " s, nổi lên thở!");
  }
  warnings(warn, w);
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    const held = snap.hold.map(asItem);
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      if (held[i]) itemCell(held[i], x0, y0, sz, false);
      else { ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz); }
    }
    text("Giỏ " + held.length + "/" + cap + "  " + itemSummary(held), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
    spoiledToast(w);
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = HC ? "#1a1a1a" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = HC ? "#fff" : "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(st.dish, sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const angry = [];  // khách sắp giận: còn chờ món và kiên nhẫn < 25%
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = HC ? "#000" : "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    if (HC) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      const ratio = c.patience_ticks_left !== undefined ? c.patience_ticks_left / patMax : 1;
      const soon = c.state !== "eating" && ratio < 0.25;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (soon) {
        ctx.strokeStyle = HC ? "#ffeb3b" : "#ff1744"; ctx.lineWidth = HC ? 4 : 3; ctx.stroke();
        text("😠", cx, cy + 6, { size: Math.max(14, 0.7 * s), align: "center", raw: true });
        angry.push(c.id + " bàn " + c.table_id + " còn " + Math.ceil(c.patience_ticks_left / 60) + " s");
      }
      text(c.dish_id || "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, ratio, soon ? "#ff1744" : "#e57373");
    }
  });
  if (angry.length) warnings(["😠 KHÁCH SẮP GIẬN — " + angry.join(", ")], w);
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hand, px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  // kho: v1.2 là mảng cá thể; kho đếm cũ (v1.0/v1.1) là object kind -> số lượng
  let stock = [];
  if (Array.isArray(snap.stock)) stock = snap.stock.map(asItem);
  else if (snap.stock) Object.keys(snap.stock).forEach((k) => { for (let i = 0; i < snap.stock[k]; i++) stock.push({ id: "", kind: k, fresh: 100 }); });
  const held = new Set();
  (snap.customers || []).forEach((c) => (Array.isArray(c.reserved) ? c.reserved : []).forEach((i) => held.add(i)));
  const cs = Math.max(10, Math.min(22, (w - 28) / Math.max(1, stock.length) - 3));
  stock.forEach((it, i) => itemCell(it, 14 + i * (cs + 3), h - bottom + 6, cs, held.has(it.id)));
  text("Kho: " + (stock.length ? itemSummary(stock) : "(trống)") + (held.size ? "  ·  viền vàng = đang giữ chỗ" : ""), 14, 52, { size: 13, color: "#cfd8dc" });
  spoiledToast(w);
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- bench (python3 -m chonoi.bench): đo khoảng cách giữa các khung rAF sau làm nóng, gửi về POST /bench -----
const B = BENCH ? { warm: Number(Q.get("warmup") || 3), dur: Number(Q.get("duration") || 30), t0: null, last: 0, first: 0, ms: [], sent: false } : null;
function benchTick(ts) {
  if (!B || B.sent || !snap) return;
  if (B.t0 === null) { B.t0 = ts; B.last = ts; B.first = Date.now(); return; }  // khung đầu của cảnh đo (đã có snapshot)
  const el = (ts - B.t0) / 1000;
  if (el > B.warm) B.ms.push(ts - B.last);
  B.last = ts;
  if (el >= B.warm + B.dur) {
    B.sent = true;
    fetch("/bench", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ frame_ms: B.ms, first_frame_epoch_ms: B.first, viewport: cv.width + "x" + cv.height, dpr: window.devicePixelRatio || 1 }) });
  }
}

function frame(ts) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = HC ? "#000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
  benchTick(ts);
}
requestAnimationFrame(frame);
</script>
